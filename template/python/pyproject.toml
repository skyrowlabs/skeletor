[tool.black]
line-length = {{LINE_LENGTH}}
target-version = ["py{{PY_NODOT}}"]
extend-exclude = '''
/(
    \.git
  | \.venv
  | \.venv-ci
  | venv
  | build
  | dist
  | \.egg-info
  | node_modules
  | \.pytest_cache
  | tmp
)/
'''

[tool.isort]
profile = "black"
line_length = {{LINE_LENGTH}}
skip_gitignore = true

# Name the first-party packages instead of letting isort infer them from what
# happens to be on disk. Inference reads the directories next to the cwd, so the
# same file sorts one way from the repo root and another from a subdirectory or
# a partial checkout — and the disagreement shows up as a formatter fight in
# review rather than as anything that looks like a config problem.
known_first_party = ["cli", "scripts", "tests"]
skip = [".venv", ".venv-ci", "venv", ".git", "build", "dist", "node_modules", ".pytest_cache", "tmp"]

# Keep this block in sync with tests/pytest.ini. That file is the copy that
# applies when only a service directory plus tests/ is mounted; this one applies
# when pytest is invoked without a tests/ path argument.
[tool.pytest.ini_options]
addopts = "--strict-markers"
filterwarnings = ["error::pytest.PytestReturnNotNoneWarning"]
timeout = 120
markers = [
    "unit: host-side tests, no running services required",
    "integration: requires the stack up and seeded",
    "manual: never in scheduled CI (E2E, live third-party, paid APIs)",
    "slow: slow-running test",
    "security: security test",
]
