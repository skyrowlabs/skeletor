name: Nightly Coverage

# Runs the suites that a pull request does not, on a schedule, because their
# verdict does not change a merge decision — only a weekly one.
#
# The rule this encodes: **detection latency should match consequence latency.**
# Nothing on the integration branch reaches a user until a release, so a check
# belongs on a nightly or on the release train unless its cost GROWS before then.
#
# It must use the SAME stack setup as ci.yml — see check_workflow_drift.py. The
# bug that check exists for was exactly this workflow missing a setup step that
# ci.yml had, so three tests failed every run for two days and had never once
# been green, while the same tests passed on pull requests.

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage & ratchets
    runs-on: ubuntu-latest
    env:
      {{CI_ENV_VAR}}: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: {{BASE_BRANCH}}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '{{PY}}'

      - run: pip install -r scripts/requirements.txt

      # One junit report per marker, because the two ratchets below measure
      # opposite kinds of thing. A skip count belongs to the run that produced
      # it — `count_skips` sums a whole report, so a combined one charges
      # integration's skips to the unit budget and says "unit" while doing it.
      # Coverage is the reverse: a whole-tree line rate that both runs
      # contribute to, so they append into one data file and the xml is written
      # once, in its own step, where an empty integration selection cannot skip
      # it.
      - name: Full suite with coverage
        run: |
          mkdir -p tmp
          python -m pytest tests/ -m unit -q \
            --junitxml=tmp/junit-unit.xml \
            --cov --cov-report= \
            --durations=25
          status=0
          python -m pytest tests/ -m integration -q \
            --junitxml=tmp/junit-integration.xml \
            --cov --cov-append --cov-report= \
            --durations=25 || status=$?
          # Exit 5 is pytest for "the marker selected nothing", and a scaffold
          # ships no integration tests. The report is still written, so the
          # ratchet reads a real zero rather than a missing file.
          [ "$status" -eq 0 ] || [ "$status" -eq 5 ]
          python -m coverage xml -o tmp/coverage.xml

      - name: Coverage ratchet
        run: python scripts/check_coverage_budget.py --suite unit

      - name: Skip budget
        run: |
          python scripts/check_skip_budget.py --suite unit --junit tmp/junit-unit.xml
          python scripts/check_skip_budget.py --suite integration --junit tmp/junit-integration.xml

      - name: Workflow drift
        run: python scripts/check_workflow_drift.py
