name: PR Draft Discipline

# Nudges the habit that saves the most Actions minutes: open as a draft, iterate
# in draft, flip to ready once. It comments; it never blocks — a gate that
# refuses a ready PR would be worked around by opening it ready in the first
# place, which is the behaviour this exists to change.

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  advise:
    name: Draft discipline
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false && github.event.action == 'opened'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const decide = require('./.github/scripts/docs-only.cjs');
            // Docs-only PRs are exempt: they run one cheap job either way, so
            // the advice would be noise. Same shared definition as ci.yml — the
            // pattern is never re-inlined.
            const { docsOnly, fullSuite } = await decide({ github, context, core });
            if (docsOnly) return;

            // ## This headline is branched at RUN TIME, and the two rewordings before
            // ## it are why
            //
            // It read *"re-runs the full suite"*. A ready pull request carrying code
            // into the BASE branch of a two-branch tree runs the gate, the node job
            // and the unit suite — not everything — so that was false for the base
            // most pull requests target. The commit that fixed the conditional eleven
            // lines below had named "a bot comment that tells a contributor so on
            // their own PR" as the worst place for that claim, and left this line.
            //
            // **The fix for that shipped a second false sentence**, which is the
            // finding worth keeping. It became *"every job it earns — and it carries
            // code, so that is strictly more than a draft would run"*: true against
            // the release branch, and false against the base branch of a two-branch
            // tree, where `fullSuite` is false for ready and draft alike and the two
            // run IDENTICAL jobs. Two rewordings, two false universals, because a
            // reworded sentence is still a sentence asserting something the tree
            // decides.
            //
            // `SCAFFOLD-IF` cannot split it — those are HTML comments and a YAML
            // syntax error here — which is what made rewording look like the only
            // option. It was not: `decide()` already returns `fullSuite`, computed
            // from this pull request's own base and author, so the claim can be
            // *read* rather than asserted. A prose fix in a workflow is a guess about
            // configuration; a branch on the classifier is the configuration.
            //
            // The negative branch does not say "drafting saves nothing" and stop.
            // sky.boss's note, from the tree where it is the live case: a bare
            // negative reads as the workflow apologising for its own existence, and
            // the reviewer-facing reason for drafting survives the CI accounting
            // entirely. Reported by mind.head, twice.
            //
            // ## Why not decide it at scaffold time, which was asked for and declined
            //
            // sky.boss proposed a substituted boolean instead of a run-time read, and
            // they are right that the mechanism is available — this block does carry a
            // substituted branch name, so substitution reaches inside it. They would
            // ship the negative sentence unconditionally.
            //
            // **That proof used to point at the release-branch placeholder a fixed
            // number of lines below, and sky.boss is the reason it does not.** (The
            // old sentence spelled the placeholder, which a scaffold then substituted,
            // so the quotation of it could not survive being quoted here either.) A
            // comment addressed to the tree most
            // likely to have diverged from it cannot safely assert what is beside it:
            // they had declined this whole file, so the line being pointed at was not
            // in their copy, and the offsets in their copy are not ours. Their line is
            // the general one, and it applies to any block of ours that argues from its
            // own surroundings. The four cases, walked rather than argued, for a ready
            // pull request carrying code:
            //
            //     tree           base of the PR      fullSuite   drafting saves
            //     one-branch     main (= release)    true        the full suite
            //     two-branch     develop             false       nothing
            //     two-branch     main (= release)    true        the full suite
            //     either         docs-only          (exempt)     n/a, returns above
            //
            // **The last column is a property of the template's job graph, not a
            // universal.** It reads "the full suite" because `ci.yml` as shipped gates
            // several jobs on `docs_only`, so a draft runs fewer of them. A tree that
            // pruned that graph — dropped the integration or UI jobs, or gates nothing
            // on the classifier — has no row where drafting saves anything, and the
            // argument below is then correct about this template and does not reach
            // that tree. sky.boss asked for this clause while declining the file, which
            // is exactly the position it is written for.
            //
            // Row three is the whole disagreement. In a two-branch tree the positive
            // arm fires only on a pull request into the release branch, which is
            // usually release-please's — a bot, and nobody reads a comment on it. So
            // the arm looks dead, and the tempting conclusion is to delete it.
            //
            // It is not dead: a human hotfix straight to the release branch takes
            // that row, and there the unconditional negative sentence is FALSE in the
            // direction that costs minutes. A scaffold-time boolean cannot see which
            // base a pull request will target, because that is not a fact about the
            // tree. So the trade is a dead-but-true arm against a live-but-sometimes-
            // false sentence, and this file has now shipped two of the second kind.
            //
            // Worth knowing while reading this, because it explains an absence:
            // **in a two-branch tree a human contributor will normally only ever see
            // the negative sentence.** That is correct, not a bug.
            //
            // ## The limit, which is sky.boss's other point and is real
            //
            // `fullSuite` is computed against `'{{RELEASE_BRANCH}}'` — a literal
            // rendered once, at scaffold time. A tree that RENAMES its release branch
            // afterwards keeps the old name here, so this comment advises against a
            // branch that no longer releases, and `ci.yml` gates against it too. No
            // check in the tree can catch it: the real release branch is a fact about
            // the repository's settings and its git refs, and every gate here asks
            // whether the tree is consistent with itself. Renaming means a sweep for
            // the rendered name — wherever your tree spells it, which is this file and
            // `.github/scripts/docs-only.cjs` as shipped and may be neither if you have
            // rearranged them. `git grep` for the branch name is the instruction that
            // survives a fork; a line number is not.

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                fullSuite
                  ? '👋 This PR was opened **ready**, so every push to it runs the full suite. A draft'
                  : '👋 This PR was opened **ready**. A draft carrying code runs the same jobs this one',
                fullSuite
                  ? 'carrying code runs the gate, the node job and the unit suite and skips the rest.'
                  : 'does, so drafting costs no CI time either way — it is worth doing for the reviewer,',
                fullSuite ? '' : 'who can see the work is not finished without being asked to look at it.',
                '',
                fullSuite ? 'Cheaper loop:' : 'Either way:',
                '',
                '```bash',
                'gh pr ready --undo ' + context.payload.pull_request.number + '   # back to draft',
                'gh pr ready ' + context.payload.pull_request.number + '          # once, when it is done',
                '```',
                '',
                'Nothing is un-gated by drafting: GitHub blocks merging a draft regardless, and',
                'marking it ready fires `ready_for_review`, which re-runs what this PR earns — and a',
                'change entering `{{RELEASE_BRANCH}}` earns everything before it can merge.',
              ].join('\n'),
            });
