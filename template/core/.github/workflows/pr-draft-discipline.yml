name: PR Draft Discipline

# Nudges the habit that saves the most Actions minutes: open as a draft, iterate
# in draft, flip to ready once. It comments; it never blocks — a gate that
# refuses a ready PR would be worked around by opening it ready in the first
# place, which is the behaviour this exists to change.

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  advise:
    name: Draft discipline
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false && github.event.action == 'opened'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const decide = require('./.github/scripts/docs-only.cjs');
            // Docs-only PRs are exempt: they run one cheap job either way, so
            // the advice would be noise. Same shared definition as ci.yml — the
            // pattern is never re-inlined.
            const { docsOnly } = await decide({ github, context, core });
            if (docsOnly) return;

            // **The headline below is a universal claim and must stay true in both
            // branch shapes.** It read *"re-runs the full suite"*, which is the
            // sentence `docs-only.cjs` corrects in itself: a ready pull request
            // carrying code into the BASE branch of a two-branch tree runs the gate,
            // the node job and the unit suite, not everything. The commit that fixed
            // the conditional eleven lines below named "a bot comment that tells a
            // contributor so on their own PR" as the worst place for that claim, and
            // left this line — the opening sentence of the same string array.
            //
            // It cannot be split by `SCAFFOLD-IF`: those are HTML comments and would
            // be a YAML syntax error, which is why prose in a workflow says the thing
            // that is true everywhere and lets the substituted release branch below
            // carry the narrower half. mind.head's finding.

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '👋 This PR was opened **ready**, which means every push to it re-runs every job it',
                'earns — and it carries code, so that is strictly more than a draft would run.',
                '',
                'Cheaper loop:',
                '',
                '```bash',
                'gh pr ready --undo ' + context.payload.pull_request.number + '   # back to draft',
                '# ...iterate; a draft carrying code skips the expensive jobs...',
                'gh pr ready ' + context.payload.pull_request.number + '          # once, when it is done',
                '```',
                '',
                'Nothing is un-gated by drafting: GitHub blocks merging a draft regardless, and',
                'marking it ready fires `ready_for_review`, which re-runs what this PR earns — and a',
                'change entering `{{RELEASE_BRANCH}}` earns everything before it can merge.',
              ].join('\n'),
            });
