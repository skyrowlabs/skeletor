name: CI

# The cost model this workflow encodes
# ────────────────────────────────────
# Two facts drive every gating decision below:
#
#   1. Requiring a status context costs nothing. Only RUNNING a job costs
#      minutes. A required context that reports `skipped` satisfies branch
#      protection, so size the required list for what must gate — never trim it
#      to save money. The savings come from job-level gating, below.
#
#   2. A `synchronize` event on a READY pull request re-runs everything that PR
#      earns. Iterating in draft and flipping to ready once, at the end, is the
#      single largest saving available — in the project this was extracted from,
#      42% of all Actions minutes ended in a failed or cancelled run because
#      every PR was opened ready and pushed to four to six times.
#
# So: draft PRs run the gate job alone; a ready PR runs what its base branch
# earns; and the heavy suite runs only where its verdict changes a decision.

on:
  pull_request:
    # `ready_for_review` is LOAD-BEARING. Remove it and the gated jobs never
    # re-run when a PR flips out of draft — they stay `skipped`, which branch
    # protection ACCEPTS, and the PR merges having run nothing.
    # tests/test_ci_draft_gate.py fails if it disappears.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [{{BASE_BRANCH}}, {{RELEASE_BRANCH}}]
  push:
    # BOTH branches, not just the release one. A repo that commits directly to
    # {{BASE_BRANCH}} — every project does, while it is one person — otherwise
    # runs nothing at all on those commits, and "no workflow ran" is
    # indistinguishable from "the workflow passed" anywhere you would look for
    # the answer. That is the expensive half; the cost is the cheap half: a PR
    # flow tests the merge commit a second time, which is one bounded extra run
    # per merge and is not even pure duplication, since a squash merge is a
    # different commit than the PR head ever tested.
    branches: [{{BASE_BRANCH}}, {{RELEASE_BRANCH}}]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ── The gate ────────────────────────────────────────────────────────────
  # Always runs, on every event, and is cheap (~1 min). It answers two
  # questions the expensive jobs are gated on, so the answer is computed once.
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    outputs:
      full_suite: ${{ steps.decide.outputs.full_suite }}
      docs_only: ${{ steps.decide.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '{{PY}}'

      - name: Decide what this PR earns
        id: decide
        uses: actions/github-script@v9
        with:
          script: |
            const decide = require('./.github/scripts/docs-only.cjs');
            const result = await decide({ github, context, core });
            core.setOutput('docs_only', String(result.docsOnly));
            core.setOutput('full_suite', String(result.fullSuite));
            core.summary
              .addHeading('CI Gate')
              .addTable([
                [{data: 'Question', header: true}, {data: 'Answer', header: true}],
                ['Docs-only change', String(result.docsOnly)],
                ['Full suite', String(result.fullSuite)],
                ['Reason', result.reason],
              ])
              .write();

      - name: Fast structural checks
        run: |
          python scripts/check_doc_tables.py
          python scripts/check_source_doc_refs.py
          python scripts/check_output_discipline.py

  # ── Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Types
    needs: gate
    if: needs.gate.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '{{PY}}'

      # Pinned to the SAME versions as .pre-commit-config.yaml, which is the
      # source of truth. tests/test_lint_tool_parity.py fails if they diverge.
      - name: Install lint toolchain
        run: pip install -r scripts/requirements.txt

      - name: flake8 (blocking set)
        run: flake8 . --select=E9,F63,F7,F82,F401 --show-source --statistics

      - name: flake8 (informational)
        run: flake8 . --max-complexity=15 --max-line-length={{LINE_LENGTH}} --statistics
        continue-on-error: true

      - name: isort
        run: isort --check-only --diff .

      - name: black
        run: black --check --line-length={{LINE_LENGTH}} .

      # Pyright resolves its interpreter from PATH, so the dependency set it
      # sees decides which errors exist. .github/pyright-deps.txt must stay a
      # SUPERSET of the unit-test job's installs — a leaner environment is not a
      # more permissive check, just a different one.
      - name: Install type-check dependencies
        run: pip install -r .github/pyright-deps.txt

      - name: pyright (whole project)
        run: |
          pip install pyright==1.1.411
          pyright --project pyrightconfig.json

  # ── Unit tests ──────────────────────────────────────────────────────────
  # Ungated by full_suite: the host-side suite is minutes, and it is the check
  # most likely to catch the thing a docs-only detector got wrong.
  unit-tests:
    name: Unit Tests (host-side)
    needs: gate
    if: needs.gate.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    env:
      # Under this flag an env-gate skip becomes a FAILURE. CI guarantees the
      # environment, so a skip here means the harness broke — and a harness that
      # skips its whole suite reports green.
      {{CI_ENV_VAR}}: '1'
    steps:
      # Full history, not the default shallow clone.
      # `tests/test_docs_name_live_code.py` asks git whether a symbol was ever
      # defined here, and `git log --all` answers "no" for everything in a
      # shallow clone — so the suite would go green having looked at nothing.
      # That test asserts the clone is not shallow rather than trusting it, so
      # without this the job fails loudly instead; the depth is what makes it
      # pass honestly. The gate job above already pays this cost.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '{{PY}}'
      - run: pip install -r scripts/requirements.txt

      # A scaffold ships no `[project]` block, so this does nothing until the
      # tree becomes a real package — and the moment it does, every test that
      # imports it fails COLLECTION, which is exit 2 and is not the exit 5 the
      # integration job tolerates. The job then goes red for a reason
      # that has nothing to do with the tests it is named for. Reading whether
      # the block is there is a fact about the tree, not a guess about it, and
      # both branches say out loud which one they took: a step that installs
      # nothing in silence is the same failure as a suite that selects nothing
      # in silence.
      - name: Install the project, if it is one
        run: |
          if [ -f pyproject.toml ] && grep -q '^\[project\]' pyproject.toml; then
            echo "pyproject.toml declares [project] — installing it editable"
            pip install -e .
          else
            echo "no [project] block in this tree — nothing to install"
          fi

      - name: Unit suite
        run: python -m pytest tests/ -m unit -q --durations=25

      - name: Skip budget
        run: python scripts/check_skip_budget.py

  # ── Integration ─────────────────────────────────────────────────────────
  # Gated on full_suite. When it is skipped it still REPORTS `skipped`, which
  # branch protection accepts — that is why it is skipped at the job level and
  # never via a trigger `paths-ignore`. A never-reported required check blocks
  # a PR forever.
  integration:
    name: Integration Tests
    needs: gate
    if: needs.gate.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    env:
      {{CI_ENV_VAR}}: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '{{PY}}'
      - run: pip install -r scripts/requirements.txt

      # Same step as the unit job, and the reason is stated there. It matters
      # more here: a collection failure is exit 2, and the tolerance below is
      # written for exit 5.
      - name: Install the project, if it is one
        run: |
          if [ -f pyproject.toml ] && grep -q '^\[project\]' pyproject.toml; then
            echo "pyproject.toml declares [project] — installing it editable"
            pip install -e .
          else
            echo "no [project] block in this tree — nothing to install"
          fi

      # SCAFFOLD: stand up the stack here. If two workflows both do this, put
      # the steps in a composite action under .github/actions/ and have both
      # use it — never hand-copy. See AGENTS.md Critical Rule 11.
      # Exit 5 is pytest for "the marker selected nothing", and a scaffold ships
      # no integration test — so a bare call is red on arrival, which is how a
      # team learns that red is normal. An empty selection is REPORTED, never
      # passed off as a run; every other non-zero status still fails the job.
      # The unit job above gets no such tolerance: tests ship for it.
      - name: Integration suite
        run: |
          python -m pytest tests/ -m integration -q --durations=25 || status=$?
          if [ "${status:-0}" -eq 5 ]; then
            echo "::notice title=Integration suite::no integration tests are marked yet — the suite is empty, not passing"
          elif [ "${status:-0}" -ne 0 ]; then
            exit "$status"
          fi

  # ── Release automation ──────────────────────────────────────────────────
  release-please:
    name: Release Please
    if: github.event_name == 'push' && github.ref == 'refs/heads/{{RELEASE_BRANCH}}'
    needs: [lint, unit-tests, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
