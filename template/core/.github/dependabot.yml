# Version updates. Monthly: Dependabot *alerts* (`{{CLI}} doctor` checks they are
# on) report a vulnerable version as soon as one is published, so this file only
# has to keep pins from drifting. Weekly was noise in jam.sense.
#
# `cooldown` holds a release back five days before proposing it: a hijacked
# package is usually caught and yanked inside that window, and
# dependabot-auto-merge.yml would otherwise merge it the night it lands.
version: 2

updates:
  # scripts/requirements.txt pins the toolchain every gate runs.
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: monthly
    cooldown:
      default-days: 5
    # Pinned twice, here and in .pre-commit-config.yaml, and
    # tests/test_lint_tool_parity.py is red until both agree, so a bump of one
    # alone could never pass CI and never merge. Bump both by hand, or take the
    # template's next upgrade. A tool you add to that test's `TOOLS` goes here
    # too: test_dependabot_never_bumps_a_lint_pin_alone is red until it does.
    ignore:
      - dependency-name: black
      - dependency-name: flake8
      - dependency-name: isort
      - dependency-name: pyright
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
      include: scope{{DEPENDABOT_NPM}}
