# Findings `tests/test_publication.py` may leave in a tracked file, and why.
#
# Format, three keys:
#   <path> <match>: <why>   one finding in one file
#   <path>: <why>           every finding in that tracked file, e.g. a frozen design render
#   <match>: <why>          that exact match in any file, e.g. a placeholder path
#
# An entry that exempts nothing is stale and fails the test, so an exemption
# cannot outlive what it was written for.
