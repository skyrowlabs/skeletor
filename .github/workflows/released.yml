name: Announce a release

# skeletor's version segment on skyrowlabs.com is baked into index.html by that
# repo's badges.py. Its only trigger was a daily cron, so a tag cut after the
# run sat unannounced until the next morning — v0.2.0 did exactly that on
# 2026-09-01. This closes the gap: the tag push tells the site, and the site
# decides what to do about it.
#
# It posts an event, not a command. `project-released` is the site's published
# type and every project repo sends the same one; which workflows respond, and
# what they rewrite, stays the site's business. Nothing here knows what a badge
# is.
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  # A GitHub Release is a *rendering* of the tag, never a second copy of it. The
  # notes are the annotation `git tag -a` already carries, read back out of git
  # here — so there is one place a release note is written, and it is the same
  # place `skeletor_ref()` records into every scaffold's `.skeletor.json`.
  #
  # It exists because the information was unreachable, not unwritten: 41 tags
  # carried 11-31 line bodies apiece and `gh release list` was empty, so anybody
  # who had not cloned the repo saw no release notes at all. The tag body was
  # only readable by somebody who already knew the `--format` incantation.
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `fetch-depth: 0` because both halves of the note need history the tag
      # ref alone does not carry: the annotation body, and the *previous* tag,
      # which is what the template-file count is measured against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The notes are assembled from git rather than fetched by `gh
      # --notes-from-tag`, which would read the annotation and nothing else. The
      # computed line is the point: two of the three releases before this
      # workflow existed changed **zero** files under `template/`, and a reader
      # deciding whether to run `bin/skeletor-upgrade` was made to infer that
      # from prose. It is a fact about the artifact, so it is measured here
      # instead of claimed in the body.
      - name: Assemble the notes from the tag annotation
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git tag -l --format='%(contents)' "$TAG" > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::$TAG has no annotation — a lightweight tag carries no note to publish."
            exit 1
          fi
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo
            echo "---"
            if [ -n "$PREV" ]; then
              COUNT=$(git diff --name-only "$PREV".."$TAG" -- template/ | wc -l)
              echo "\`template/\` files changed since \`$PREV\`: **$COUNT**"
              echo
              if [ "$COUNT" -eq 0 ]; then
                echo "Nothing a scaffold ships moved, so \`bin/skeletor-upgrade\` has nothing"
                echo "to carry for an existing tree. Verify it yourself rather than trusting"
                echo "this line: \`git diff --name-only $PREV..$TAG -- template/\`."
              else
                echo "Carry it into an existing tree with \`bin/skeletor-upgrade <target> --dry-run\`,"
                echo "which reports what changed *for that tree* rather than in general."
              fi
            else
              echo "First tag — no predecessor to measure \`template/\` against."
            fi
          } >> notes.md

      # Skipped rather than failed when the release is already there: a workflow
      # re-run is not a defect, and `gh release create` cannot overwrite. A
      # genuine failure still reddens, because unlike the site dispatch below,
      # this artifact is the one a reader is being sent to.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "$TAG is already published — leaving it alone."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag

  notify:
    runs-on: ubuntu-latest
    steps:
      # SITE_DISPATCH_TOKEN is an org secret: a fine-grained PAT whose only
      # grant is Actions: Read and write on skyrowlabs/skyrowlabs.com. Every
      # repo that ships this workflow reads the same secret, so going public
      # with the next project costs a file, not another token.
      #
      # This must not fail the tag. A stale bar on a marketing page is not a
      # reason to redden a release, and the site's own cron picks the tag up
      # within the day regardless — so the step reports and moves on.
      - name: Post project-released to skyrowlabs.com
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN is not set — the site will catch up on its cron."
            exit 0
          fi
          gh api repos/skyrowlabs/skyrowlabs.com/dispatches \
            -f event_type=project-released \
            -f 'client_payload[project]=skeletor' \
            -f "client_payload[version]=${GITHUB_REF_NAME}" \
            && echo "asked the site to refresh for ${GITHUB_REF_NAME}"
