# How far behind are the versions we start other people's repositories on?
#
# Every pin under `template/` is inherited by every project scaffolded after it
# goes stale, and nothing about a stale pin is visible from inside this repo —
# there is no lockfile here to nag anybody.
#
# This reports into ONE issue, updated in place. A bot that opens a fresh issue
# per week is a bot people mute, and a muted report is the same as no report.
#
# It deliberately does not bump anything. A bump changes what `black` does to a
# generated tree and what CI installs, and the only thing that can judge it is
# `bin/skeletor-verify`. See the module docstring in bin/skeletor-check-pins.

name: pins

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: template pin freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: report
        # GITHUB_TOKEN raises the api.github.com rate limit from 60/hr per
        # runner IP — which is shared, and therefore already spent — to 1000.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          bin/skeletor-check-pins --markdown --fail-on-stale > pins.md
          code=$?
          set -e
          cat pins.md
          if [ "$code" -eq 0 ]; then echo "stale=false" >> "$GITHUB_OUTPUT"; else echo "stale=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/github-script@v9
        env:
          STALE: ${{ steps.report.outputs.stale }}
        with:
          script: |
            const fs = require('fs');
            const title = 'Template pin freshness';
            const stale = process.env.STALE === 'true';
            const body = fs.readFileSync('pins.md', 'utf8')
              + `\n\n<sub>Generated by \`.github/workflows/pins.yml\` — run ${context.runId}.</sub>`;

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'pins',
            });
            const existing = open.find((issue) => issue.title === title);

            if (existing) {
              // Closing on green is the half that makes the open issue mean
              // something. An issue that is always open is wallpaper.
              await github.rest.issues.update({
                ...context.repo,
                issue_number: existing.number,
                body,
                state: stale ? 'open' : 'closed',
              });
            } else if (stale) {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['pins'] });
            } else {
              core.info('Every pin is current — nothing to open.');
            }
