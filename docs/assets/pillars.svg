<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="Three things skeletor is: it copies real files, the tree governs itself, and it keeps moving">
  <title>Copies real files · Governs itself · Keeps moving</title>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(0,0)">
      <rect x="0.5" y="0.5" width="323" height="189" rx="14" fill="#05090e" stroke="#1c2633"/>
      <rect x="22" y="22" width="40" height="40" rx="10" fill="#38bdf8" fill-opacity="0.14"/>
      <g transform="translate(31,31) scale(0.9167)" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></g>
      <text x="22" y="98" font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e8edf4">Copies real files</text>
      <text font-size="14" fill="#a9b6c6"><tspan x="22" y="126">An executable, not a guide an agent</tspan><tspan x="22" y="147">paraphrases. A typo'd placeholder fails</tspan><tspan x="22" y="168">the scaffold. It never ships.</tspan></text>
    </g>
    <g transform="translate(338,0)">
      <rect x="0.5" y="0.5" width="323" height="189" rx="14" fill="#05090e" stroke="#1c2633"/>
      <rect x="22" y="22" width="40" height="40" rx="10" fill="#2dd4bf" fill-opacity="0.14"/>
      <g transform="translate(31,31) scale(0.9167)" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></g>
      <text x="22" y="98" font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e8edf4">Governs itself</text>
      <text font-size="14" fill="#a9b6c6"><tspan x="22" y="126">Agent rules, a docs lifecycle, marker</tspan><tspan x="22" y="147">tests and cost-aware CI. All green on</tspan><tspan x="22" y="168">the first commit.</tspan></text>
    </g>
    <g transform="translate(676,0)">
      <rect x="0.5" y="0.5" width="323" height="189" rx="14" fill="#05090e" stroke="#1c2633"/>
      <rect x="22" y="22" width="40" height="40" rx="10" fill="#a78bfa" fill-opacity="0.14"/>
      <g transform="translate(31,31) scale(0.9167)" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M6 8.5v1a4 4 0 0 0 4 4h4a4 4 0 0 0 4-4v-1M12 13.5v2"/></g>
      <text x="22" y="98" font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e8edf4">Keeps moving</text>
      <text font-size="14" fill="#a9b6c6"><tspan x="22" y="126">The tree records how it was made, so a</tspan><tspan x="22" y="147">later template change arrives as a</tspan><tspan x="22" y="168">three-way merge.</tspan></text>
    </g>
  </g>
</svg>
