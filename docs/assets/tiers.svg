<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180" role="img" aria-label="Three cumulative tiers: core, governed adds to core, agentic adds to governed">
  <title>core → governed → agentic</title>
  <rect x="0.5" y="0.5" width="999" height="179" rx="16" fill="#05090e" stroke="#1c2633"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(20,20)">
      <rect x="0.75" y="0.75" width="303.5" height="138.5" rx="12" fill="#111820" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="18" y="30" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#38bdf8">TIER 1</text>
      <text x="18" y="64" font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#e8edf4">core</text>
      <text font-size="13" fill="#a9b6c6"><tspan x="18" y="96">Agent rules · docs lifecycle · project CLI ·</tspan><tspan x="18" y="116">marker tests · gated CI · versioning</tspan></text>
    </g>
    <g transform="translate(348,20)">
      <rect x="0.75" y="0.75" width="303.5" height="138.5" rx="12" fill="#111820" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="18" y="30" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#2dd4bf">TIER 2 · + core</text>
      <text x="18" y="64" font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#e8edf4">governed</text>
      <text font-size="13" fill="#a9b6c6"><tspan x="18" y="96">Multi-agent tree safety · scoped commits ·</tspan><tspan x="18" y="116">worktrees · drift checks · ratchets</tspan></text>
    </g>
    <g transform="translate(676,20)">
      <rect x="0.75" y="0.75" width="303.5" height="138.5" rx="12" fill="#111820" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="18" y="30" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#a78bfa">TIER 3 · + governed</text>
      <text x="18" y="64" font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#e8edf4">agentic</text>
      <text font-size="13" fill="#a9b6c6"><tspan x="18" y="96">Subagents · /implement + /release skills ·</tspan><tspan x="18" y="116">scheduled-job registry</tspan></text>
    </g>
  </g>
</svg>
