# isort for THIS repository's own working copy — not for generated trees.
#
# It exists because running isort here answers differently than running it on a
# scaffold, and the answer here was the wrong one. `cli/` and `scripts/` do not
# exist at this repo's root — they only exist inside `template/<overlay>/` — so
# isort classifies them as third-party, deletes the blank line separating them
# from `click`, and a real scaffold's `isort --check-only` then rejects the
# result. Twenty files, and the failure only shows up in `bin/skeletor-verify`.
#
# Naming them first-party here makes a local run agree with the tree the
# template renders into. The settings below must match
# `template/core/pyproject.toml`, which is what a generated tree actually uses.
# (It said `template/python/` for a long time; that overlay ships only `docs/`,
# so the pointer named no file and nothing here reads it.)
#
# `cli` is the DEFAULT of `--shell-package`, and it is the right entry whatever
# an adopter renames their shell to: this list governs isort over THIS
# repository, where the package is on disk at `template/core/cli/` under its
# unrendered name. A renamed tree gets its own name through
# `{{SHELL_PACKAGE}}` in the rendered pyproject.
[settings]
profile = black
line_length = 120
known_first_party = cli,scripts,tests,conftest,scanning
