name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No API key and no Docker daemon: the offline baseline is what makes
      # the pipeline testable in CI, which is the point of having one.
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
